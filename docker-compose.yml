name: webhook-processor

# Shared settings for every process built from ./backend.
# Any of these can be overridden from the shell or a .env file (see .env.example).
x-backend-env: &backend-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/webhooks
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
  BACKOFF_BASE_MS: ${BACKOFF_BASE_MS:-1000}
  BACKOFF_MAX_MS: ${BACKOFF_MAX_MS:-30000}
  LEASE_MS: ${LEASE_MS:-10000}
  HEARTBEAT_MS: ${HEARTBEAT_MS:-3000}
  RECOVERY_INTERVAL_MS: ${RECOVERY_INTERVAL_MS:-2000}

# Every backend service builds the same Dockerfile target. BuildKit's cache makes the repeats
# free, and per-service image names avoid parallel builds racing for one tag.
x-backend-build: &backend-build
  context: ./backend
  target: runtime

x-worker: &worker
  build: *backend-build
  command: ['node', 'dist/main.worker.js']
  init: true
  restart: unless-stopped
  stop_grace_period: 20s
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webhooks
    ports:
      - '${POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d webhooks']
      interval: 2s
      timeout: 3s
      retries: 30

  # Applies schema migrations once, then exits. Everything else waits for it.
  migrate:
    build: *backend-build
    command: ['node', 'dist/migrate.js']
    environment: *backend-env
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *backend-build
    command: ['node', 'dist/main.js']
    init: true
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 3000
      SERVICE_NAME: api
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 20

  worker-1:
    <<: *worker
    environment:
      <<: *backend-env
      WORKER_ID: worker-1
      SERVICE_NAME: worker-1
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}

  worker-2:
    <<: *worker
    environment:
      <<: *backend-env
      WORKER_ID: worker-2
      SERVICE_NAME: worker-2
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}

  frontend:
    build:
      context: ./frontend
    image: webhook-processor/frontend:local
    init: true
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
    ports:
      - '${FRONTEND_HOST_PORT:-3001}:3001'
    depends_on:
      api:
        condition: service_healthy

  # Integration tests against the same PostgreSQL (separate webhooks_test database).
  # Run with: docker compose --profile test run --rm tests
  tests:
    profiles: ['test']
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/webhooks_test
    depends_on:
      postgres:
        condition: service_healthy

  # Load generator for scripts/demo-burst.sh: docker compose --profile tools run --rm burst
  burst:
    profiles: ['tools']
    build:
      context: ./backend
      target: test
    command: ['npx', 'ts-node', '--transpile-only', 'scripts/burst.ts']
    environment:
      API_URL: http://api:3000
      TOTAL: 500
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
